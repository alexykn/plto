name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings -W clippy::pedantic
      - run: cargo test --workspace --all-targets
      - run: cargo package --workspace --locked

  build:
    name: Build (${{ matrix.asset }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: plto-x86_64-unknown-linux-gnu
          - os: macos-15-intel
            asset: plto-x86_64-apple-darwin
          - os: macos-14
            asset: plto-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo build -p plto --bins --release --locked
      - name: Package archive
        run: |
          archive_dir="${{ matrix.asset }}-${GITHUB_REF_NAME#v}"
          mkdir -p "dist/$archive_dir/bin"
          cp README.md "dist/$archive_dir/"
          cp target/release/plto "dist/$archive_dir/bin/"
          cp target/release/plto-plugin-{cargo,git,pip,pnpm,precommit,uv} "dist/$archive_dir/bin/"
          tar -C dist -czf "${{ matrix.asset }}.tar.gz" "$archive_dir"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Verify tag version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          test "$tag_version" = "$package_version"
      - name: Publish crates.io packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          publish_package() {
            local package_name="$1"
            local package_version="$2"
            local registry_output
            local publish_output
            local publish_status

            if registry_output=$(cd "$(mktemp -d)" && cargo info --registry crates-io \
              "${package_name}@${package_version}" 2>&1); then
              echo "${package_name} v${package_version} is already published; skipping."
              return 0
            fi

            if [[ "$registry_output" != *"could not find"* ]]; then
              printf '%s\n' "$registry_output" >&2
              return 1
            fi

            for attempt in {1..5}; do
              if publish_output=$(cargo publish --locked -p "$package_name" 2>&1); then
                printf '%s\n' "$publish_output"
                return 0
              fi

              publish_status=$?
              printf '%s\n' "$publish_output" >&2
              if [[ "$publish_output" != *"status 429 Too Many Requests"* ]] || (( attempt == 5 )); then
                return "$publish_status"
              fi

              echo "crates.io rate-limited ${package_name}; retrying in 240 seconds (attempt ${attempt}/5)." >&2
              sleep 240
            done
          }

          version="${GITHUB_REF_NAME#v}"
          for package_name in \
            plto-plugin-api \
            plto-plugin-support \
            plto-plugin-cargo \
            plto-plugin-git \
            plto-plugin-pip \
            plto-plugin-pnpm \
            plto-plugin-precommit \
            plto-plugin-uv \
            plto; do
            publish_package "$package_name" "$version"
          done
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes release/*
