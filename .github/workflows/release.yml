name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings -W clippy::pedantic
      - run: cargo test --workspace --all-targets
      - run: cargo package --workspace --locked

  build:
    name: Build (${{ matrix.asset }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: plto-x86_64-unknown-linux-gnu
          - os: macos-15-intel
            asset: plto-x86_64-apple-darwin
          - os: macos-14
            asset: plto-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo build -p plto --bins --release --locked
      - name: Package archive
        run: |
          archive_dir="${{ matrix.asset }}-${GITHUB_REF_NAME#v}"
          mkdir -p "dist/$archive_dir/bin"
          cp README.md "dist/$archive_dir/"
          cp target/release/plto "dist/$archive_dir/bin/"
          cp target/release/plto-plugin-{cargo,git,pip,pnpm,precommit,uv} "dist/$archive_dir/bin/"
          tar -C dist -czf "${{ matrix.asset }}.tar.gz" "$archive_dir"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Verify tag version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          test "$tag_version" = "$package_version"
      - name: Publish crates.io packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --locked -p plto-plugin-api
          cargo publish --locked -p plto-plugin-support
          cargo publish --locked -p plto-plugin-cargo
          cargo publish --locked -p plto-plugin-git
          cargo publish --locked -p plto-plugin-pip
          cargo publish --locked -p plto-plugin-pnpm
          cargo publish --locked -p plto-plugin-precommit
          cargo publish --locked -p plto-plugin-uv
          cargo publish --locked -p plto
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes release/*
