[workspace]
resolver = "3"
members = [
  "crates/plto-plugin-api",
  "crates/plto-plugin-support",
  "plugins/plto-plugin-git",
  "plugins/plto-plugin-uv",
  "plugins/plto-plugin-pip",
  "plugins/plto-plugin-pnpm",
  "plugins/plto-plugin-cargo",
  "plugins/plto-plugin-precommit",
]

[package]
name = "plto"
version = "1.0.0"
description = "A local project scaffolding tool with bundled setup plugins"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
include = [
  "Cargo.toml",
  "Cargo.lock",
  "rust-toolchain.toml",
  "README.md",
  "crates/plto/src/**",
  "crates/plto/tests/**",
]

[lib]
name = "plto"
path = "crates/plto/src/lib.rs"

[[bin]]
name = "plto"
path = "crates/plto/src/main.rs"

[[bin]]
name = "plto-plugin-cargo"
path = "crates/plto/src/bin/plto-plugin-cargo.rs"

[[bin]]
name = "plto-plugin-git"
path = "crates/plto/src/bin/plto-plugin-git.rs"

[[bin]]
name = "plto-plugin-pip"
path = "crates/plto/src/bin/plto-plugin-pip.rs"

[[bin]]
name = "plto-plugin-pnpm"
path = "crates/plto/src/bin/plto-plugin-pnpm.rs"

[[bin]]
name = "plto-plugin-precommit"
path = "crates/plto/src/bin/plto-plugin-precommit.rs"

[[bin]]
name = "plto-plugin-uv"
path = "crates/plto/src/bin/plto-plugin-uv.rs"

[[test]]
name = "init_cleanup"
path = "crates/plto/tests/init_cleanup.rs"

[[test]]
name = "plugin_timeout"
path = "crates/plto/tests/plugin_timeout.rs"

[[test]]
name = "validation"
path = "crates/plto/tests/validation.rs"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/alxknt/plto"
rust-version = "1.97.1"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
libc = "0.2.186"
plto-plugin-api = { version = "1.0.0", path = "crates/plto-plugin-api" }
plto-plugin-support = { version = "1.0.0", path = "crates/plto-plugin-support" }
plto-plugin-cargo = { version = "1.0.0", path = "plugins/plto-plugin-cargo" }
plto-plugin-git = { version = "1.0.0", path = "plugins/plto-plugin-git" }
plto-plugin-pip = { version = "1.0.0", path = "plugins/plto-plugin-pip" }
plto-plugin-pnpm = { version = "1.0.0", path = "plugins/plto-plugin-pnpm" }
plto-plugin-precommit = { version = "1.0.0", path = "plugins/plto-plugin-precommit" }
plto-plugin-uv = { version = "1.0.0", path = "plugins/plto-plugin-uv" }

[dependencies]
anyhow.workspace = true
blake3 = "1.8.5"
clap.workspace = true
directories.workspace = true
fs2 = "0.4.3"
libc.workspace = true
minijinja = "2.21.0"
plto-plugin-api.workspace = true
plto-plugin-support.workspace = true
plto-plugin-cargo.workspace = true
plto-plugin-git.workspace = true
plto-plugin-pip.workspace = true
plto-plugin-pnpm.workspace = true
plto-plugin-precommit.workspace = true
plto-plugin-uv.workspace = true
regex = "1.13.1"
serde.workspace = true
serde_json.workspace = true
shell-words = "1.1.1"
toml.workspace = true
walkdir = "2.5.0"
